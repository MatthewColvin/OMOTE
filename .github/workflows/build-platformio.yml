name: ESP32 Build

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      
      - name: Update APT cache (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update
      
      - name: Install system dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libboost-all-dev libcurl4-openssl-dev
          sudo apt-get install -y --fix-missing libsdl2-dev || true
      
      - name: Initialize PlatformIO environment
        working-directory: ./Platformio
        run: |
          pio pkg install --environment esp32_Rev1 || true
          pio pkg install --environment esp32_Rev5 || true
          pio pkg install --environment esp32_Rev5_3661 || true
        continue-on-error: true
      
      - name: Fix ESP-IDF pydantic dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -d "$HOME/.platformio/penv/.espidf-5.3.2" ]; then
            $HOME/.platformio/penv/.espidf-5.3.2/bin/python -m pip install \
              "pydantic>=2.0,<2.10" \
              "pydantic-settings>=2.0,<2.6" \
              "pydantic-core>=2.0,<2.24" \
              --upgrade --no-cache-dir
            echo "✓ Fixed pydantic dependencies"
          else
            echo "ESP-IDF venv not created yet, skipping fix"
          fi
      
      - name: Fix ESP-IDF pydantic dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "$env:USERPROFILE\.platformio\penv\.espidf-5.3.2\Scripts\python.exe") {
            & "$env:USERPROFILE\.platformio\penv\.espidf-5.3.2\Scripts\python.exe" -m pip install `
              "pydantic>=2.0,<2.10" `
              "pydantic-settings>=2.0,<2.6" `
              "pydantic-core>=2.0,<2.24" `
              --upgrade --no-cache-dir
            Write-Host "✓ Fixed pydantic dependencies"
          } else {
            Write-Host "ESP-IDF venv not created yet, skipping fix"
          }
        shell: pwsh

      - name: Build Rev_1 Hardware
        working-directory: ./Platformio
        run: pio run --environment esp32_Rev1

      - name: Build Rev_5 Hardware
        working-directory: ./Platformio
        run: pio run --environment esp32_Rev5

      - name: Build Rev_5_3661 Hardware
        working-directory: ./Platformio
        run: pio run --environment esp32_Rev5_3661