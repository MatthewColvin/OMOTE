; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = x64_sim


; Shared options
[env]
test_framework = googletest
;debug_test = test_... ;uncomment this and add tests to debug them
build_flags =
  ; Don't use lv_conf.h. Tweak params via platfom.ini.
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_CONF_SKIP
  ;------------- LVGL ------------------------------------------
  -D LV_MEM_CUSTOM=1
  -D LV_FONT_MONTSERRAT_12=1
  -D LV_FONT_MONTSERRAT_16=1
  -D LV_FONT_MONTSERRAT_24=1
  -D LV_USE_CALENDAR=1
  -D LV_USE_IMGBTN=1
  -D LV_USE_WIN=1
  -D LV_THEME_DEFAULT_DARK=1
  -D LV_BUILD_EXAMPLES=0

  ;------------ OMOTE Defines -----------------------------------
  ;--Screen Dimentions
  -D SCREEN_WIDTH=240
  -D SCREEN_HEIGHT=320
  
  ;--HomeAssistant Config ---------------------------------------
  ;See https://developers.home-assistant.io/docs/api/rest/ for info
  -D HOMEASSISTANT_API_TOKEN='"YOUR_HA_TOKEN"'
  -D HOMEASSISTANT_IP_ADDRESS='"YOUR_HA_IP"'
  -D HOMEASSISTANT_PORT='"8123"'
  ;Will Prefer URL if is is defined by uncommenting next line
  ;-D HOMEASSISTANT_URL='"https://your_ha_url.com"'

  ; ------------- Includes ------------------------------------
  -I .
  -I OmoteUI
  -I OmoteUI/UIs
  
lib_deps =
  lvgl/lvgl@^9.2.0
  LVGL_Joystick = https://github.com/MatthewColvin/LVGL_Joystick.git#caf40fe8756c6840c5c5b546dab00d3f72123194
  HomeAssistUI@1.0.0
  shah253kt/Magic Enum@^0.9.5
lib_archive = false
lib_compat_mode = strict

extra_scripts = post:setupScript.py

[env:esp32_Rev1]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2025.03.30/platform-espressif32.zip
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = Rev1Partitions.csv
upload_speed = 1000000
lib_deps =
  ${env.lib_deps}
	sparkfun/SparkFun LIS3DH Arduino Library@^1.0.3
	irlib = https://github.com/tonhuisman/IRremoteESP8266.git#feature/C++20-compatibility
  adafruit/Adafruit BusIO @ 1.9.6
  lovyan03/LovyanGFX@^1.2.0
	knolleary/PubSubClient@^2.8
	Wire
	WiFi
	SPI
	Keypad
	Preferences
  HttpClient
  ; --------- OMOTE Local Libs -----------------------------
  HardwareCreation
  Rev1HalImpl
  RapidJsonUtility
  Device
lib_ignore = 
  Rev5HalImpl ; Ignore the Rev5 since this target is for rev1
build_flags =
  ${env.build_flags}
  -std=gnu++2a ; C++20
  -D LGFX_USE_V1
  -D LV_MEM_SIZE="(55U * 1024U)"
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	; ---------------- TFT_eSPI Defines replace(User_setup.h-file)---------
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	;-D TFT_WIDTH=SCREEN_WIDTH
	;-D TFT_HEIGHT=SCREEN_HEIGHT
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=5
	-D TFT_DC=9
	-D TFT_RST=-1
	-D SPI_FREQUENCY=40000000 ; 40MHz default, some displays might support 80MHz
	-D SPI_TOUCH_FREQUENCY=2500000
  
monitor_filters = esp32_exception_decoder
build_unflags =
    -std=gnu++11


[env:esp32_Rev5]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2025.03.30/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 1000000
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_build.partitions = Rev1Partitions.csv
lib_deps =
  ${env.lib_deps}
	sparkfun/SparkFun LIS3DH Arduino Library@^1.0.3
	irlib = https://github.com/tonhuisman/IRremoteESP8266.git#feature/C++20-compatibility
  adafruit/Adafruit BusIO @ 1.9.6
  lovyan03/LovyanGFX@^1.2.0
	knolleary/PubSubClient@^2.8
  adafruit/Adafruit TCA8418@^1.0.2
  adafruit/Adafruit LTR329 and LTR303@^2.0.1
  sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
  Wire
	WiFi
	SPI
	Keypad
	Preferences
  HttpClient
  ; --------- OMOTE Local Libs -----------------------------
  HardwareCreation
  Rev5HalImpl
  RapidJsonUtility
  Device
lib_ignore = 
  Rev1HalImpl ; Ignore the Rev1 since this target is for rev5
build_flags =
  ${env.build_flags}
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
	; ---------------- TFT_eSPI Defines replace(User_setup.h-file)---------
	-D USER_SETUP_LOADED=1
	;-D ILI9341_DRIVER=1
	;-D TFT_WIDTH=SCREEN_WIDTH
	;-D TFT_HEIGHT=SCREEN_HEIGHT
	;-D TFT_MOSI=23
	;-D TFT_SCLK=18
	;-D TFT_CS=5
	;-D TFT_DC=9
	;-D TFT_RST=-1
	;-D SPI_FREQUENCY=40000000 ; 40MHz default, some displays might support 80MHz
	;-D SPI_TOUCH_FREQUENCY=2500000
  -D LV_MEM_CUSTOM=0
	-D LV_MEM_SIZE="(128U * 1024U)"
	'-D LV_MEM_POOL_INCLUDE=<esp32-hal-psram.h>'
	-D LV_MEM_POOL_ALLOC="ps_malloc"

  -D LV_CONF_SKIP=1
	
  -D OMOTE_HARDWARE_REV5
	-D OMOTE_KEYBRD_3661

monitor_filters = esp32_exception_decoder
build_unflags =
    -D LV_MEM_CUSTOM=1
    -std=gnu++11


[env:x64_sim]
platform = native@^1.2.1
build_flags =
  ${env.build_flags}
  -std=c++20
  -D OMOTE_SIM
  -lcurl 
  ; --------- OMOTE Config -----------------------------
  -D IS_SIMULATOR
  ; --------- SDL drivers options -----------------------------
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D LV_USE_SDL
  -D SDL_HOR_RES=SCREEN_WIDTH
  -D SDL_VER_RES=SCREEN_HEIGHT
  -D SDL_ZOOM=1
  -D SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
  ; -------------- Sim Includes ---------------------------
  
  -I lib/SimulatorHalImpl
  -I lib/SimulatorHalImpl/wifiHandlerSim

debug_build_flags =
  -g ;Allow debugging in vscode
  -O0 ;No Optomizations

lib_deps =
  ${env.lib_deps}
build_src_filter =
  +<simMain.cpp>
  

[env:esp32Debug]
extends = env:esp32
build_type = debug

[env:x64_sim_windows]
extends = env:x64_sim
build_flags =
  ${env:x64_sim.build_flags}
  ; -------------- websocketpp ---------------------------
  ; Seems that the mingw and websocketpp auto detect cx11 thread presence logic is 
  ; not working this should force websocketpp to use std::thread includes
  -D _WEBSOCKETPP_CPP11_THREAD_ 
  -D ASIO_STANDALONE
  -lws2_32 ;Link agains socket lib so asio can find defs
